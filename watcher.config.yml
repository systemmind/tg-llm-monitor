filters:
  - name: "my_custom_filter"
    enabled: true
    include_any:
      - "a"
      - "o"
      - "e"
      - "к"
    exclude_any:
    min_length: 10

  - name: "crypto_spam"
    enabled: true
    include_any:
      - "airdrop"
      - "pump"
      - "x100"
    exclude_any: []
    min_length: 1

routing:
  # if true - only send messages that match at least one filter to Redis
  matched_only: true
