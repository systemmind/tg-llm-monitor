filters:
  - name: "jobs"
    enabled: true
    include_any:
      - "вакан"
      - "ищу работу"
      - "junior"
      - "удален"
    exclude_any:
      - "реклама"
      - "казино"
    min_length: 10

  - name: "crypto_spam"
    enabled: true
    include_any:
      - "airdrop"
      - "pump"
      - "x100"
    exclude_any: []
    min_length: 1

routing:
  # если true — отправлять в Redis только сообщения, прошедшие хотя бы один фильтр
  matched_only: true
