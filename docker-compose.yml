services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    volumes:
      - ./postgres:/var/lib/postgresql/data

  watcher:
    build: ./watcher
    depends_on: [redis]
    env_file: .env
    volumes:
      - watcher_session:/data/session
      - ./watcher/watcher/settings/config.yml:/config/config.yml:ro
    restart: unless-stopped

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    container_name: tg-ollama
    ports: ["11434:11434"]
    volumes:
      - ./ollama:/root/.ollama
    # gpus: all   # uncomment this line to launch LLM on GPU
    restart: unless-stopped

  # This service uses local ollama model
  worker-ollama:
    profiles: ["llm"]
    build: ./worker
    depends_on: [redis, postgres, ollama]
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: llama3.2
    command:
      - --verbose
      - --ollama
    volumes:
      - ./worker/prompt.txt:/config/prompt.txt:ro
    restart: unless-stopped

  # This service uses cloud LLM API (OpenAI-compatible)
  worker-cloud:
    profiles: ["cloud"]
    build: ./worker
    depends_on: [redis, postgres]
    env_file: .env
    environment:
      LLM_MODEL: gpt-4o-mini
    command:
      - --verbose
    volumes:
      - ./worker/prompt.txt:/config/prompt.txt:ro
    restart: unless-stopped

volumes:
  redis_data:
  watcher_session:
